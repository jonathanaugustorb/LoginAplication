spring.application.name=LoginCompleto
spring.profiles.default=dev

spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.representation.big-decimal=decimal128

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
spring.data.web.pageable.max-page-size=50

app.zone-id=America/Sao_Paulo
app.mail.from=${MAIL_FROM:nao-responda@estoque.local}
app.password-reset.expiration=30m
app.password-reset.resend-interval=1m
