<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Erro', ~{::section})}">
<body>
<section class="text-center py-5">
    <p class="display-4 fw-bold text-body-secondary" th:text="${status}">500</p>
    <th:block th:switch="${status}">
        <h1 class="h4" th:case="403">Acesso negado</h1>
        <h1 class="h4" th:case="404">Página não encontrada</h1>
        <h1 class="h4" th:case="*">Algo deu errado</h1>
    </th:block>
    <th:block th:switch="${status}">
        <p class="text-body-secondary" th:case="403">Você não tem permissão para acessar esta página.</p>
        <p class="text-body-secondary" th:case="404">O endereço acessado não existe ou o registro foi removido.</p>
        <p class="text-body-secondary" th:case="*">Ocorreu um erro inesperado. Tente novamente em instantes.</p>
    </th:block>
    <a th:href="@{/}" class="btn btn-primary mt-3">Voltar ao início</a>
</section>
</body>
</html>
