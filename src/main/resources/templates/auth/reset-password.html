<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth-layout :: layout('Redefinir senha', ~{::section})}">
<body>
<section>
    <h2 class="h6 mb-2">Redefinir senha</h2>
    <p class="text-body-secondary small">
        A senha deve ter entre 8 e 64 caracteres, com letras e números.
    </p>

    <form th:action="@{/reset-password}" th:object="${form}" method="post" novalidate>
        <input type="hidden" th:field="*{token}">
        <div th:replace="~{fragments/form :: fieldError('passwordConfirmed')}"></div>
        <div th:replace="~{fragments/form :: textField('password', 'Nova senha', 'password', 'new-password')}"></div>
        <div th:replace="~{fragments/form :: textField('confirmPassword', 'Confirme a nova senha', 'password', 'new-password')}"></div>
        <button type="submit" class="btn btn-primary w-100">Redefinir senha</button>
    </form>
</section>
</body>
</html>
