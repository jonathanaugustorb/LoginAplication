<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Alterar senha', ~{::section})}">
<body>
<section class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <h1 class="h3 mb-3">Alterar senha</h1>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <p class="text-body-secondary small">
                    A nova senha deve ter entre 8 e 64 caracteres, com letras e números.
                </p>

                <form th:action="@{/account/password}" th:object="${form}" method="post" novalidate>
                    <div th:replace="~{fragments/form :: fieldError('passwordConfirmed')}"></div>
                    <div th:replace="~{fragments/form :: textField('currentPassword', 'Senha atual', 'password', 'current-password')}"></div>
                    <div th:replace="~{fragments/form :: textField('password', 'Nova senha', 'password', 'new-password')}"></div>
                    <div th:replace="~{fragments/form :: textField('confirmPassword', 'Confirme a nova senha', 'password', 'new-password')}"></div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Salvar</button>
                        <a th:href="@{/}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
