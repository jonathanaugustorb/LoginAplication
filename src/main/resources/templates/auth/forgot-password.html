<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth-layout :: layout('Esqueci minha senha', ~{::section})}">
<body>
<section>
    <h2 class="h6 mb-2">Esqueci minha senha</h2>
    <p class="text-body-secondary small">
        Informe o e-mail cadastrado. Enviaremos um link para você criar uma nova senha.
    </p>

    <form th:action="@{/forgot-password}" th:object="${form}" method="post" novalidate>
        <div th:replace="~{fragments/form :: textField('email', 'E-mail', 'email', 'email')}"></div>
        <button type="submit" class="btn btn-primary w-100">Enviar link</button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/login}" class="small">Voltar ao login</a>
    </div>
</section>
</body>
</html>
