<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" sec:authorize="isAuthenticated()" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Estoque de Peças</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar"
                aria-controls="main-navbar" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="main-navbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Início</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/items}">Itens</a></li>
            </ul>

            <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-2">
                <span class="navbar-text">
                    <span sec:authentication="principal.name">Usuário</span>
                    <span class="badge text-bg-secondary ms-1" sec:authentication="principal.role.role">Perfil</span>
                </span>
                <a th:href="@{/account/password}" class="btn btn-outline-light btn-sm">Alterar senha</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
